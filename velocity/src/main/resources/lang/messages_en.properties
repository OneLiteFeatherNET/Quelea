command.players-only=<red>Only players can use this command.</red>
command.help.title=<gradient:#7c3aed:#db2777>Party commands</gradient>
command.help.create=<gray>/party create</gray> <dark_gray>-</dark_gray> start a party
command.help.invite=<gray>/party invite [player]</gray> <dark_gray>-</dark_gray> invite a player
command.help.accept=<gray>/party accept [player]</gray> <dark_gray>-</dark_gray> accept an invite
command.help.deny=<gray>/party deny [player]</gray> <dark_gray>-</dark_gray> decline an invite
command.help.leave=<gray>/party leave</gray> <dark_gray>-</dark_gray> leave your party
command.help.list=<gray>/party list</gray> <dark_gray>-</dark_gray> show the members
command.help.kick=<gray>/party kick [player]</gray> <dark_gray>-</dark_gray> remove a member (leader)
command.help.promote=<gray>/party promote [player]</gray> <dark_gray>-</dark_gray> make a member the leader (leader)
command.help.disband=<gray>/party disband</gray> <dark_gray>-</dark_gray> end the party (leader)
command.help.warp=<gray>/party warp</gray> <dark_gray>-</dark_gray> bring the party to your server (leader)
command.help.chat=<gray>/pc [message]</gray> <dark_gray>-</dark_gray> chat with your party
