command.help.create.hover=<gray>Start a party with you as its leader.</gray>
command.help.invite.hover=<gray>Invite an online player. They get [Accept] and [Deny] buttons.</gray>
command.help.accept.hover=<gray>Join the party that invited you.</gray>
command.help.deny.hover=<gray>Decline an invite.</gray>
command.help.leave.hover=<gray>Leave your party.</gray>
command.help.list.hover=<gray>Show the members. The leader is marked with ★.</gray>
command.help.kick.hover=<gray>Remove a member from your party. Leaders only.</gray>
command.help.promote.hover=<gray>Make a member the new leader. Leaders only.</gray>
command.help.disband.hover=<gray>End the party for everyone. Leaders only.</gray>
command.help.warp.hover=<gray>Bring every member to your server. Leaders only.</gray>
command.help.chat.hover=<gray>Send a message that only your party reads.</gray>
command.help.public.hover=<gray>Open your party so anyone can join it with /party join. Opening needs a permission; closing does not. Leaders only.</gray>
command.help.request.hover=<gray>Ask the party of an online player to let you in. A public party lets you in at once.</gray>
command.help.join.hover=<gray>Join the party of an online player directly. Only works for an open party.</gray>
command.help.approve.hover=<gray>Let the player whose request you received into your party. Leaders only.</gray>
command.help.reject.hover=<gray>Decline a join request. The player must wait before asking again. Leaders only.</gray>
