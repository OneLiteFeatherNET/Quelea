# MiniMessage templates. <name> placeholders are filled with plain (unparsed) text.
prefix=<gradient:#7c3aed:#db2777>Party</gradient> <dark_gray>»</dark_gray>

problem.validation-failed=<red>That request was not valid. Check the command and try again.</red>
problem.not-found=<red>The party service does not know that request.</red>
problem.method-not-allowed=<red>That action is not available here.</red>
problem.unsupported-media-type=<red>The party service did not understand the request.</red>
