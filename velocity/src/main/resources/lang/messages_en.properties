# MiniMessage templates. <name> placeholders are filled with plain (unparsed) text, so player input is never formatted.
#
# Colour guide (keep the meaning of each colour when you translate or restyle a message):
#   brand gradient   <gradient:#7c3aed:#db2777>   prefix and headers
#   commands         <#c4b5fd>                    /party invite, /pc
#   arguments        <#a78bfa>                    [player]
#   explanations     <gray>
#   separators       <dark_gray>                  » • │ -
#   success          <#86efac>
#   errors           <#fca5a5>                    every problem.* key
#   hints            <#fde68a>
#   leader           <gold>★
#   names            <white>
prefix=<gradient:#7c3aed:#db2777>Party</gradient> <dark_gray>»</dark_gray>

