# Fixed name for the generated OpenAPI document: META-INF/swagger/quelea.yml in build/classes/java/main.
# The velocity client generator reads this file, so the name must not depend on the version.
micronaut.openapi.filename=quelea
# Swagger UI at /swagger-ui (anonymous), generated from the same document; "Authorize" sends a bearer token.
micronaut.openapi.views.spec=swagger-ui.enabled=true,swagger-ui.theme=flattop
