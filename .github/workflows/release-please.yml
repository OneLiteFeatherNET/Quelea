name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      docker_version:
        description: "Version to (re)build & push the backend image for, e.g. 1.2.3 (no leading v). Runs only the image job."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # Reusable workflow: exposes release_created, tag_name, version (and more) as job outputs. Every
  # follow-up job below gates on release_created - never on `push: tags`, because tags created with
  # GITHUB_TOKEN do not trigger workflows.
  release-please:
    if: github.event_name == 'push'
    uses: OneLiteFeatherNET/workflows/.github/workflows/release-please.yml@v2.9.1
    secrets: inherit

  # ---- Maven publish ----
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-publish.yml@v2.9.1
    with:
      java-version: "25.0.3"
      java-distribution: "temurin"
    secrets: inherit

  # Gradle produces the Micronaut optimized Docker context and uploads it as an artifact for the
  # (toolchain-agnostic) docker job to consume.
  build-context:
    name: Build Docker context
    needs: release-please
    # Runs on a real release, or on a manual dispatch to (re)publish a given version.
    if: |
      always() &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
       github.event_name == 'workflow_dispatch')
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-docker-context.yml@v2.9.1
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.docker_version || needs.release-please.outputs.version }}
      gradle-command: "./gradlew :backend:jar :backend:optimizedBuildLayers :backend:optimizedDockerfile -Pversion=$VERSION"
      context-path: "backend/build/docker/optimized"
      artifact-name: "docker-context-release"
    secrets: inherit

  docker:
    name: Build Docker image
    needs: [release-please, build-context]
    permissions:
      contents: read
      id-token: write   # keyless cosign signing via GitHub OIDC
    if: |
      always() && needs.build-context.result == 'success' &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
       github.event_name == 'workflow_dispatch')
    uses: OneLiteFeatherNET/workflows/.github/workflows/docker-publish.yml@v2.9.1
    with:
      image-name: "onelitefeather/quelea"
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.docker_version || needs.release-please.outputs.version }}
      context: "backend/build/docker/optimized"
      artifact-name: "docker-context-release"
      blob-chunk: "90000000"   # ~90 MB, under the 100 MB Cloudflare cap
      req-concurrent: "4"
    secrets: inherit

  # The Velocity proxy plugin is a shaded jar. Operators download it from the GitHub release for the
  # CloudNet template, so it is attached to the release rather than published as an image.
  velocity-jar:
    name: Attach Velocity plugin jar
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Build the Velocity plugin jar
        env:
          ONELITEFEATHER_MAVEN_USERNAME: ${{ secrets.ONELITEFEATHER_MAVEN_USERNAME }}
          ONELITEFEATHER_MAVEN_PASSWORD: ${{ secrets.ONELITEFEATHER_MAVEN_PASSWORD }}
        run: ./gradlew :velocity:shadowJar -Pversion="${RELEASE_VERSION}"
      - name: Attach the jar to the GitHub release
        run: gh release upload "${RELEASE_TAG}" velocity/build/libs/quelea-velocity-*.jar --clobber

  # Dependency inventory of the release, shipped to Dependency-Track. Without an artifact the reusable
  # workflow generates the SBOM with Trivy from the checked-out tag, so no build-tool setup is needed.
  sbom:
    name: Publish SBOM
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/sbom-publish.yml@v2.9.1
    with:
      project-name: "Quelea"
      project-version: ${{ needs.release-please.outputs.version }}
    secrets: inherit
